<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Music Sampler — Take 4 (Kid-Optimized)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1729;
      --surface:   #1a2540;
      --surface2:  #1e2d4a;
      --border:    #2a3d5e;
      --text:      #e2e8f0;
      --muted:     #8899b0;
      --accent:    #4a9eff;

      --green:     #22c55e;
      --green-bg:  #052e16;
      --green-bd:  #166534;

      --blue:      #60a5fa;
      --blue-bg:   #0c1a3a;
      --blue-bd:   #1e3a6e;

      --orange:    #fb923c;
      --orange-bg: #2c1200;
      --orange-bd: #7c2d12;

      --purple:    #c084fc;
      --purple-bg: #1a0a2e;
      --purple-bd: #5b21b6;

      --teal:      #2dd4bf;
      --teal-bg:   #042f2e;
      --teal-bd:   #0f766e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 64px;
    }

    /* ── Header ── */
    .site-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .site-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .site-header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .take-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 12px;
      border-radius: 20px;
      background: #1e3a6e;
      border: 1px solid #4a9eff;
      color: #60a5fa;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Stop All bar ── */
    .stop-all-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }
    .stop-all-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 8px;
      border: 1px solid var(--orange-bd);
      background: var(--orange-bg);
      color: var(--orange);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 80ms ease, box-shadow 80ms ease;
    }
    .stop-all-btn:hover {
      filter: brightness(1.2);
      box-shadow: 0 0 0 2px rgba(251,146,60,0.25);
    }
    .stop-all-btn:active { transform: scale(0.96); }

    /* ── Selected section ── */
    .selected-section {
      background: linear-gradient(135deg, #1a2540 0%, #0f2030 100%);
      border: 2px solid #4a9eff;
      border-radius: 14px;
      padding: 20px 22px 24px;
      margin-bottom: 32px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
    }
    .selected-section::before {
      content: '\2605';
      position: absolute;
      top: -14px;
      left: 20px;
      background: var(--bg);
      padding: 0 8px;
      font-size: 1.2rem;
      color: #4a9eff;
    }
    .selected-section .section-label {
      color: #4a9eff;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .selected-section .section-style {
      color: #8bb8e8;
      font-size: 0.82rem;
      font-style: italic;
    }
    .selected-section .empty-msg {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      padding: 12px 0;
    }

    /* ── Tracks grid ── */
    .tracks-container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    /* ── Track card ── */
    .track-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    /* Playing state — animated border glow */
    @keyframes pulse-glow {
      0%   { box-shadow: 0 0 0 0 var(--glow-color, rgba(74,158,255,0.5)); }
      50%  { box-shadow: 0 0 14px 3px var(--glow-color, rgba(74,158,255,0.25)); }
      100% { box-shadow: 0 0 0 0 var(--glow-color, rgba(74,158,255,0.5)); }
    }
    .track-card.playing {
      border-color: var(--card-color, var(--accent));
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* ── Track header ── */
    .track-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .track-icon {
      font-size: 1.5rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .track-info { flex: 1 1 0; }
    .track-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .track-desc {
      margin-top: 4px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ── Playing indicator dot ── */
    .playing-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--card-color, var(--accent));
      flex-shrink: 0;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .track-card.playing .playing-dot { opacity: 1; }
    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
    .track-card.playing .playing-dot {
      animation: blink-dot 1.2s ease-in-out infinite;
    }

    /* ── Controls row ── */
    .track-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Play/Stop toggle button */
    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 80ms ease, transform 80ms ease, box-shadow 80ms ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .play-btn:hover  { filter: brightness(1.18); box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
    .play-btn:active { transform: scale(0.93); }

    /* color variants for play buttons */
    .play-btn.blue   { background: var(--blue-bg);   border-color: var(--blue-bd);   color: var(--blue); }
    .play-btn.green  { background: var(--green-bg);  border-color: var(--green-bd);  color: var(--green); }
    .play-btn.purple { background: var(--purple-bg); border-color: var(--purple-bd); color: var(--purple); }
    .play-btn.orange { background: var(--orange-bg); border-color: var(--orange-bd); color: var(--orange); }
    .play-btn.teal   { background: var(--teal-bg);   border-color: var(--teal-bd);   color: var(--teal); }

    /* Volume slider area */
    .vol-wrap {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .vol-label {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 0;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
      min-width: 0;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: pointer;
    }
    .vol-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: pointer;
    }
    .vol-value {
      font-size: 0.72rem;
      color: var(--muted);
      width: 28px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .tracks-container { grid-template-columns: 1fr; }
      .play-btn { font-size: 0.78rem; padding: 6px 11px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <h1>Background Music Sampler</h1>
  <p>Ambient loops for a kids&rsquo; fraction-teaching app &mdash; all procedurally generated</p>
  <div class="take-badge">Take 4 &mdash; Kid-Optimized</div>
</header>

<!-- Stop All -->
<div class="stop-all-bar">
  <button class="stop-all-btn" onclick="stopAll()">
    <span>&#9632;</span> Stop All
  </button>
</div>

<!-- Selected card -->
<section class="selected-section">
  <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
    <span class="section-label">Selected Backgrounds</span>
    <span class="section-style">&#8212; Your picks for the final app</span>
  </div>
  <p class="empty-msg">Tell me which backgrounds to add here.</p>
</section>

<!-- Track cards rendered by JS -->
<div class="tracks-container" id="tracks-container"></div>

<script>
// =============================================================================
// AudioContext singleton
// =============================================================================

let _ctx = null;

function getCtx() {
  if (!_ctx) {
    _ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}

// =============================================================================
// Track state registry  { [id]: { playing, masterGain, stopFn, intervalIds[], timeoutIds[], nodes[] } }
// =============================================================================

const trackState = {};

function stopAll() {
  Object.keys(trackState).forEach(id => {
    if (trackState[id].playing) stopTrack(id);
  });
}

function stopTrack(id) {
  const s = trackState[id];
  if (!s) return;
  s.playing = false;

  (s.intervalIds || []).forEach(h => clearInterval(h));
  (s.timeoutIds  || []).forEach(h => clearTimeout(h));
  s.intervalIds = [];
  s.timeoutIds  = [];

  const g = s.masterGain;
  if (g) {
    const ctx = getCtx();
    g.gain.cancelScheduledValues(ctx.currentTime);
    g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    setTimeout(() => {
      try { g.disconnect(); } catch(e) {}
      // Stop all persistent nodes
      (s.nodes || []).forEach(n => { try { n.stop(); } catch(e) {} });
      s.nodes = [];
    }, 600);
  }

  if (s.stopFn) {
    try { s.stopFn(); } catch(e) {}
    s.stopFn = null;
  }

  updateCardUI(id, false);
}

function registerTrack(id, masterGain, stopFn) {
  if (!trackState[id]) trackState[id] = { playing: false, intervalIds: [], timeoutIds: [], nodes: [] };
  const s = trackState[id];
  s.playing    = true;
  s.masterGain = masterGain;
  s.stopFn     = stopFn || null;
  s.intervalIds = [];
  s.timeoutIds  = [];
  s.nodes      = [];
  updateCardUI(id, true);
}

function addInterval(id, handle) {
  if (trackState[id]) trackState[id].intervalIds.push(handle);
}
function addTimeout(id, handle) {
  if (trackState[id]) trackState[id].timeoutIds.push(handle);
}
function addNode(id, node) {
  if (trackState[id]) trackState[id].nodes.push(node);
}
function isPlaying(id) {
  return trackState[id] && trackState[id].playing;
}

function updateCardUI(id, playing) {
  const card = document.getElementById('card-' + id);
  const btn  = document.getElementById('btn-' + id);
  if (!card || !btn) return;
  if (playing) {
    card.classList.add('playing');
    btn.textContent = '\u25A0 Stop';
  } else {
    card.classList.remove('playing');
    btn.textContent = '\u25B6 Play';
  }
}

// =============================================================================
// Shared utilities
// =============================================================================

function midiToFreq(note) {
  return 440 * Math.pow(2, (note - 69) / 12);
}

/** White noise buffer (loopable) */
function makeNoiseBuffer(ctx, duration) {
  const len = Math.floor(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

function makeLoopingNoise(ctx, duration) {
  const src = ctx.createBufferSource();
  src.buffer = makeNoiseBuffer(ctx, duration);
  src.loop = true;
  return src;
}

/** Simple reverb convolver — longer/smoother for kids */
function makeReverb(ctx, seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const imp = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = imp.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = imp;
  return conv;
}

/** Play a single sine note with attack/decay envelope */
function playSineNote(ctx, dest, freq, gain, attackT, decayT, startT) {
  const osc = ctx.createOscillator();
  const env = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  env.gain.setValueAtTime(0.0001, startT);
  env.gain.linearRampToValueAtTime(gain, startT + attackT);
  env.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT);
  osc.connect(env);
  env.connect(dest);
  osc.start(startT);
  osc.stop(startT + attackT + decayT + 0.05);
}

/** Play a triangle note (softer timbre than square — good for xylophone/kalimba) */
function playTriNote(ctx, dest, freq, gain, attackT, decayT, startT) {
  const osc = ctx.createOscillator();
  const env = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  env.gain.setValueAtTime(0.0001, startT);
  env.gain.linearRampToValueAtTime(gain, startT + attackT);
  env.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT);
  osc.connect(env);
  env.connect(dest);
  osc.start(startT);
  osc.stop(startT + attackT + decayT + 0.05);
}

/** Soft squarish tone with high-harmonic roll-off — celesta feel */
function playCelestaNote(ctx, dest, freq, gain, attackT, decayT, startT) {
  // Mix sine (fundamental) + sine at 3rd harmonic (very soft) for bell-like quality
  [1, 3, 5].forEach((harm, i) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * harm;
    const harmGain = gain / Math.pow(harm, 2.2);
    env.gain.setValueAtTime(0.0001, startT);
    env.gain.linearRampToValueAtTime(harmGain, startT + attackT);
    env.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT * (1 / harm));
    osc.connect(env);
    env.connect(dest);
    osc.start(startT);
    osc.stop(startT + attackT + decayT + 0.1);
  });
}

/** Kalimba note: sine + 2nd harmonic, fast attack, longish sustain with soft tail */
function playKalimbaNote(ctx, dest, freq, gain, startT) {
  const attackT = 0.003;
  const decayT  = 1.6;
  // fundamental
  const osc1 = ctx.createOscillator();
  const env1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.value = freq;
  env1.gain.setValueAtTime(0.0001, startT);
  env1.gain.linearRampToValueAtTime(gain, startT + attackT);
  env1.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT);
  osc1.connect(env1); env1.connect(dest);
  osc1.start(startT); osc1.stop(startT + attackT + decayT + 0.1);
  // slight 2nd harmonic for warmth
  const osc2 = ctx.createOscillator();
  const env2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2.005; // very slight inharmonicity
  env2.gain.setValueAtTime(0.0001, startT);
  env2.gain.linearRampToValueAtTime(gain * 0.18, startT + attackT);
  env2.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT * 0.4);
  osc2.connect(env2); env2.connect(dest);
  osc2.start(startT); osc2.stop(startT + attackT + decayT + 0.1);
}

/** Xylophone note: triangle + high harmonics + fast decay */
function playXyloNote(ctx, dest, freq, gain, startT) {
  const attackT = 0.002;
  const decayT  = 0.5;
  [1, 2.76, 5.4].forEach((harm, i) => {
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq * harm;
    const hg = gain / Math.pow(i + 1, 1.8);
    env.gain.setValueAtTime(0.0001, startT);
    env.gain.linearRampToValueAtTime(hg, startT + attackT);
    env.gain.exponentialRampToValueAtTime(0.0001, startT + attackT + decayT / (i + 1));
    osc.connect(env); env.connect(dest);
    osc.start(startT); osc.stop(startT + attackT + decayT + 0.1);
  });
}

// =============================================================================
// TRACK DEFINITIONS
// =============================================================================

const TRACKS = [

  // ── 1. Gentle Lullaby Loop ─────────────────────────────────────────────────
  // Twinkle-inspired: warm sines, very simple, comforting, predictable. Key of C.
  {
    id:         'lullaby',
    name:       'Gentle Lullaby Loop',
    icon:       '\uD83C\uDF19', // crescent moon
    desc:       'Twinkle-inspired warm sine melody in C. Simple, slow, comforting. Like a music box at bedtime.',
    color:      'blue',
    glowColor:  'rgba(96,165,250,0.4)',
    defaultVol: 25,
    start(masterGain, id) {
      const ctx = getCtx();

      // Warm reverb
      const reverb = makeReverb(ctx, 2.2, 3.5);
      reverb.connect(masterGain);

      // Soft low-pass pad underneath — Cmaj7 (C3, E3, G3, B3)
      const padNotes = [48, 52, 55, 59];
      padNotes.forEach(note => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = midiToFreq(note);
        const g = ctx.createGain();
        g.gain.value = 0.018;
        osc.connect(g); g.connect(masterGain);
        osc.start();
        addNode(id, osc);
      });

      // Melody: Twinkle-ish contour without being the actual song
      // C C G G A A G (then F F E E D D C) — classic interval shape, fresh rhythm
      // Notes in MIDI, -1 = rest
      // Tempo: 66 BPM, quarter note melody — slow and sleepy
      const bpm = 66;
      const beat = 60 / bpm;

      // 16-note melodic phrase — Twinkle shape but starting/ending differently
      const melody = [
        60, 60, 67, 67,   69, 69, 67, -1,
        65, 65, 64, 64,   62, 62, 60, -1
      ];
      const noteDur = beat;           // each step = 1 quarter note
      const phraseLen = melody.length * noteDur;

      let startTime = ctx.currentTime + 0.1;

      function schedulePhrase() {
        if (!isPlaying(id)) return;
        melody.forEach((note, i) => {
          if (note < 0) return;
          const t = startTime + i * noteDur;
          playSineNote(ctx, reverb, midiToFreq(note), 0.28, 0.015, noteDur * 0.72, t);
        });
        startTime += phraseLen;
        const msUntilNext = (startTime - ctx.currentTime - 0.08) * 1000;
        const h = setTimeout(schedulePhrase, Math.max(0, msUntilNext));
        addTimeout(id, h);
      }

      schedulePhrase();
    }
  },

  // ── 2. Lo-fi Study Beats ───────────────────────────────────────────────────
  // Heartbeat pulse at ~60 BPM + warm Cmaj7 pad. No hip-hop, maximum cozy calm.
  {
    id:         'lofi',
    name:       'Lo-fi Study Beats',
    icon:       '\uD83D\uDC93', // heartbeat
    desc:       'Soft heartbeat pulse at 60 BPM with a warm Cmaj7 pad. Like reading in a cozy corner.',
    color:      'purple',
    glowColor:  'rgba(192,132,252,0.4)',
    defaultVol: 22,
    start(masterGain, id) {
      const ctx = getCtx();

      // Warm Cmaj7 pad — filtered sawtooth, heavily low-passed
      const padNotes = [48, 52, 55, 59]; // C3 E3 G3 B3
      const lpf = ctx.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.value = 650;
      lpf.Q.value = 0.5;
      lpf.connect(masterGain);

      padNotes.forEach(note => {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = midiToFreq(note);
        // tiny detuning for warmth
        osc.detune.value = (Math.random() - 0.5) * 6;
        const g = ctx.createGain();
        g.gain.value = 0.06;
        osc.connect(g); g.connect(lpf);
        osc.start();
        addNode(id, osc);
      });

      // Very slow swell LFO on pad
      const swellLFO = ctx.createOscillator();
      const swellG = ctx.createGain();
      swellLFO.frequency.value = 0.08;
      swellG.gain.value = 80;
      swellLFO.connect(swellG);
      swellG.connect(lpf.frequency);
      swellLFO.start();
      addNode(id, swellLFO);

      // Heartbeat: two soft bass thumps (lub-dub) per beat at ~60 BPM
      const bpm = 60;
      const beat = 60 / bpm;

      function scheduleHeartbeat() {
        if (!isPlaying(id)) return;
        const t = ctx.currentTime;
        // "lub" — first thump (slightly stronger)
        [0, 0.22].forEach((offset, i) => {
          const freq = i === 0 ? 80 : 68;
          const gainAmt = i === 0 ? 0.18 : 0.12;
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + offset);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.35, t + offset + 0.18);
          env.gain.setValueAtTime(gainAmt, t + offset);
          env.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.22);
          // soft highcut
          const hpf = ctx.createBiquadFilter();
          hpf.type = 'lowpass';
          hpf.frequency.value = 300;
          osc.connect(hpf); hpf.connect(env); env.connect(masterGain);
          osc.start(t + offset);
          osc.stop(t + offset + 0.28);
        });

      // Pattern: classic "interlocking" kalimba style
      const patterns = [
        // Each entry: [note, delaySecs]
        // Phrase 1: gentle rising arpeggio with thumb alternation
        [67, 0],   [64, 0.18], [62, 0.36], [67, 0.54],
        [69, 0.72],[64, 0.90], [67, 1.08], [62, 1.26],
        // Phrase 2: slightly different
        [71, 1.44],[67, 1.62], [64, 1.80], [69, 1.98],
        [67, 2.16],[64, 2.34], [62, 2.52], [59, 2.70],
        // Phrase 3: lower, resolving
        [62, 2.88],[59, 3.06], [57, 3.24], [55, 3.42],
        [57, 3.60],[59, 3.78], [62, 3.96], [64, 4.14],
        // Phrase 4: return to top, slight pause before loop
        [67, 4.32],[69, 4.50], [71, 4.68], [67, 4.86],
        [64, 5.04],[62, 5.22], [59, 5.40], [55, 5.58]
      ];
      const phraseLen = 5.58 + beat; // total + rest

      let startTime = ctx.currentTime + 0.1;

      function schedulePhrase() {
        if (!isPlaying(id)) return;
        patterns.forEach(([note, offset]) => {
          const t = startTime + offset;
          playKalimbaNote(ctx, reverb, midiToFreq(note), 0.22, t);
        });
        startTime += phraseLen;
        const msUntilNext = (startTime - ctx.currentTime - 0.08) * 1000;
        const h = setTimeout(schedulePhrase, Math.max(0, msUntilNext));
        addTimeout(id, h);
      }

      schedulePhrase();
    }
  }

];

// =============================================================================
// CARD RENDERING
// =============================================================================

function toggleTrack(id) {
  const ctx = getCtx(); // ensures AudioContext starts on user gesture
  const track = TRACKS.find(t => t.id === id);
  if (!track) return;

  if (isPlaying(id)) {
    stopTrack(id);
    return;
  }

  // Create master gain node for this track, initialize at near-zero then ramp up
  const masterGain = ctx.createGain();
  const slider = document.getElementById('vol-' + id);
  const targetVol = slider ? (parseFloat(slider.value) / 100) : (track.defaultVol / 100);
  masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
  masterGain.gain.linearRampToValueAtTime(targetVol, ctx.currentTime + 0.5);
  masterGain.connect(ctx.destination);

  // Apply card CSS glow color
  const card = document.getElementById('card-' + id);
  if (card) card.style.setProperty('--glow-color', track.glowColor);
  if (card) card.style.setProperty('--card-color', `var(--${track.color})`);

  registerTrack(id, masterGain);
  track.start(masterGain, id);
}

function onVolumeChange(id, val) {
  document.getElementById('vol-val-' + id).textContent = val + '%';
  const s = trackState[id];
  if (s && s.playing && s.masterGain) {
    const ctx = getCtx();
    s.masterGain.gain.cancelScheduledValues(ctx.currentTime);
    s.masterGain.gain.setValueAtTime(s.masterGain.gain.value, ctx.currentTime);
    s.masterGain.gain.linearRampToValueAtTime(parseFloat(val) / 100, ctx.currentTime + 0.05);
  }
}

function renderTracks() {
  const container = document.getElementById('tracks-container');
  container.innerHTML = TRACKS.map(t => `
    <div class="track-card" id="card-${t.id}">
      <div class="track-header">
        <div class="track-icon">${t.icon}</div>
        <div class="track-info">
          <div class="track-name">${t.name}</div>
          <div class="track-desc">${t.desc}</div>
        </div>
        <div class="playing-dot"></div>
      </div>
      <div class="track-controls">
        <button
          class="play-btn ${t.color}"
          id="btn-${t.id}"
          onclick="toggleTrack('${t.id}')"
        >&#9654; Play</button>
        <div class="vol-wrap">
          <span class="vol-label">Vol</span>
          <input
            class="vol-slider"
            id="vol-${t.id}"
            type="range"
            min="0" max="100"
            value="${t.defaultVol}"
            oninput="onVolumeChange('${t.id}', this.value)"
          >
          <span class="vol-value" id="vol-val-${t.id}">${t.defaultVol}%</span>
        </div>
      </div>
    </div>
  `).join('');
}

renderTracks();
</script>
