<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 2: Farmhouse Table</title>
<style>
  body {
    background: #0f1729;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  h1 {
    color: #e2c87a;
    font-size: 1.4rem;
    margin-bottom: 24px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  svg {
    max-width: 800px;
    width: 90%;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
  }
</style>
</head>
<body>

<h1>Option 2: Farmhouse Table</h1>

<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tabletop main gradient -->
    <linearGradient id="tabletopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A84A"/>
      <stop offset="35%" stop-color="#C4943A"/>
      <stop offset="100%" stop-color="#A87A2E"/>
    </linearGradient>

    <!-- Tabletop top highlight -->
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Wood grain pattern -->
    <pattern id="woodGrain" x="0" y="0" width="200" height="25" patternUnits="userSpaceOnUse">
      <rect width="200" height="25" fill="transparent"/>
      <line x1="0" y1="4" x2="200" y2="5" stroke="rgba(139,90,30,0.15)" stroke-width="0.8"/>
      <line x1="0" y1="9" x2="200" y2="8.5" stroke="rgba(139,90,30,0.1)" stroke-width="0.5"/>
      <line x1="0" y1="14" x2="200" y2="15" stroke="rgba(139,90,30,0.12)" stroke-width="0.7"/>
      <line x1="0" y1="20" x2="200" y2="19" stroke="rgba(139,90,30,0.08)" stroke-width="0.6"/>
      <!-- Slight curved grain lines -->
      <path d="M0,7 Q50,5 100,7 T200,6" fill="none" stroke="rgba(160,110,40,0.1)" stroke-width="0.6"/>
      <path d="M0,17 Q60,15 120,18 T200,16" fill="none" stroke="rgba(160,110,40,0.08)" stroke-width="0.5"/>
    </pattern>

    <!-- Leg gradient (left leg) -->
    <linearGradient id="legGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A87A2E"/>
      <stop offset="40%" stop-color="#C4943A"/>
      <stop offset="100%" stop-color="#A07028"/>
    </linearGradient>

    <!-- Leg gradient (right leg) -->
    <linearGradient id="legGradR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A07028"/>
      <stop offset="60%" stop-color="#C4943A"/>
      <stop offset="100%" stop-color="#A87A2E"/>
    </linearGradient>

    <!-- Tabletop front edge shadow -->
    <linearGradient id="edgeShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A87A2E"/>
      <stop offset="100%" stop-color="#8B6422"/>
    </linearGradient>

    <!-- Apron gradient (the board under the tabletop connecting the legs) -->
    <linearGradient id="apronGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A87A2E"/>
      <stop offset="100%" stop-color="#9A7028"/>
    </linearGradient>
  </defs>

  <!-- ==================== TABLE LEGS ==================== -->

  <!-- Left farmhouse leg - turned/curved profile -->
  <g>
    <!-- Main leg shape: tapered with a decorative bulge -->
    <path d="
      M 155,62
      L 155,72
      C 155,78 148,85 146,95
      C 144,105 150,110 150,115
      C 150,120 144,128 142,140
      C 140,152 148,158 148,165
      C 148,172 143,178 142,185
      L 142,195
      L 165,195
      L 165,185
      C 165,178 160,172 160,165
      C 160,158 168,152 166,140
      C 164,128 158,120 158,115
      C 158,110 164,105 162,95
      C 160,85 153,78 153,72
      L 153,62
      Z
    " fill="url(#legGradL)"/>

    <!-- Leg highlight -->
    <path d="
      M 155,62
      L 155,72
      C 155,78 148,85 146,95
      C 144,105 150,110 150,115
      C 150,120 144,128 142,140
      C 140,152 148,158 148,165
      C 148,172 143,178 142,185
      L 142,195
      L 150,195
      L 150,185
      C 151,178 147,172 147,165
      C 147,158 155,152 153,140
      C 151,128 146,120 146,115
      C 146,110 152,105 150,95
      C 148,85 153,78 153,72
      L 153,62
      Z
    " fill="rgba(255,255,255,0.08)"/>

    <!-- Decorative ring near top of leg -->
    <ellipse cx="154" cy="78" rx="7" ry="2.5" fill="none" stroke="rgba(139,90,30,0.3)" stroke-width="1"/>
    <!-- Decorative ring at mid -->
    <ellipse cx="153" cy="130" rx="8" ry="2.5" fill="none" stroke="rgba(139,90,30,0.25)" stroke-width="1"/>
    <!-- Small foot detail -->
    <rect x="140" y="192" width="27" height="4" rx="2" fill="#9A7028"/>
  </g>

  <!-- Right farmhouse leg - turned/curved profile (mirrored) -->
  <g>
    <path d="
      M 847,62
      L 847,72
      C 847,78 854,85 856,95
      C 858,105 852,110 852,115
      C 852,120 858,128 860,140
      C 862,152 854,158 854,165
      C 854,172 859,178 860,185
      L 860,195
      L 837,195
      L 837,185
      C 837,178 842,172 842,165
      C 842,158 834,152 836,140
      C 838,128 844,120 844,115
      C 844,110 838,105 840,95
      C 842,85 849,78 849,72
      L 849,62
      Z
    " fill="url(#legGradR)"/>

    <!-- Leg highlight -->
    <path d="
      M 847,62
      L 847,72
      C 847,78 854,85 856,95
      C 858,105 852,110 852,115
      C 852,120 858,128 860,140
      C 862,152 854,158 854,165
      C 854,172 859,178 860,185
      L 860,195
      L 853,195
      L 853,185
      C 852,178 856,172 856,165
      C 856,158 848,152 850,140
      C 852,128 857,120 857,115
      C 857,110 851,105 853,95
      C 855,85 849,78 849,72
      L 849,62
      Z
    " fill="rgba(255,255,255,0.08)"/>

    <!-- Decorative rings -->
    <ellipse cx="848" cy="78" rx="7" ry="2.5" fill="none" stroke="rgba(139,90,30,0.3)" stroke-width="1"/>
    <ellipse cx="849" cy="130" rx="8" ry="2.5" fill="none" stroke="rgba(139,90,30,0.25)" stroke-width="1"/>
    <!-- Small foot detail -->
    <rect x="835" y="192" width="27" height="4" rx="2" fill="#9A7028"/>
  </g>

  <!-- ==================== APRON (horizontal board under tabletop) ==================== -->
  <rect x="160" y="55" width="682" height="12" rx="3" fill="url(#apronGrad)"/>
  <rect x="160" y="55" width="682" height="5" rx="2" fill="rgba(255,255,255,0.04)"/>

  <!-- ==================== TABLETOP ==================== -->

  <!-- Main tabletop body -->
  <rect x="60" y="28" width="880" height="28" rx="10" fill="url(#tabletopGrad)"/>

  <!-- Wood grain overlay -->
  <rect x="60" y="28" width="880" height="28" rx="10" fill="url(#woodGrain)"/>

  <!-- Top surface highlight streak -->
  <rect x="80" y="30" width="840" height="8" rx="5" fill="url(#topHighlight)"/>

  <!-- Subtle front edge darkening (bottom of tabletop) -->
  <rect x="60" y="48" width="880" height="8" rx="0 0 10 10" fill="rgba(0,0,0,0.08)"/>

  <!-- Thin specular highlight line on very top edge -->
  <line x1="90" y1="29.5" x2="910" y2="29.5" stroke="rgba(255,235,180,0.2)" stroke-width="1" stroke-linecap="round"/>
</svg>

</body>
</html>
