<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 4: Modern Minimal</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1729;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  h1 {
    color: #c0c8d8;
    font-size: 1.4rem;
    font-weight: 500;
    margin-bottom: 2rem;
    letter-spacing: 0.02em;
  }
  .preview {
    background: #1a2340;
    border-radius: 12px;
    padding: 3rem 4rem;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <h1>Option 4: Modern Minimal</h1>
  <div class="preview">
    <svg viewBox="0 0 1000 200" width="700" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Subtle top-face gradient for depth -->
        <linearGradient id="tabletopGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#A8793E"/>
          <stop offset="100%" stop-color="#9B7040"/>
        </linearGradient>
        <!-- Front edge gradient (slightly darker) -->
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9B7040"/>
          <stop offset="100%" stop-color="#7D5A30"/>
        </linearGradient>
        <!-- Leg gradient for subtle depth -->
        <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8B6535"/>
          <stop offset="100%" stop-color="#7D5A30"/>
        </linearGradient>
      </defs>

      <!-- Left leg: angled outward, mid-century splay -->
      <polygon
        points="200,75 210,75 175,195 165,195"
        fill="url(#legGrad)"
        rx="2"
      />
      <!-- Right leg: angled outward, mirrored -->
      <polygon
        points="790,75 800,75 835,195 825,195"
        fill="url(#legGrad)"
      />

      <!-- Tabletop front edge (thin strip for depth) -->
      <rect x="120" y="65" width="760" height="15" rx="3" ry="3" fill="url(#edgeGrad)"/>

      <!-- Tabletop surface -->
      <rect x="120" y="52" width="760" height="15" rx="3" ry="3" fill="url(#tabletopGrad)"/>
    </svg>
  </div>
</body>
</html>
