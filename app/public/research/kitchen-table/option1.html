<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 1: Simple Wood Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f1729;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 2rem;
  }
  h1 {
    color: #e0d6c8;
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .preview-container {
    width: 100%;
    max-width: 900px;
    background: #1a2540;
    border-radius: 12px;
    padding: 2rem;
  }
  .preview-container svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .label {
    color: #7a8ba8;
    font-size: 0.85rem;
    margin-top: 1rem;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Option 1: Simple Wood Table</h1>

<div class="preview-container">
<svg viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tabletop wood gradient (top face) -->
    <linearGradient id="tabletopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8862A"/>
      <stop offset="30%" stop-color="#A0722A"/>
      <stop offset="70%" stop-color="#926520"/>
      <stop offset="100%" stop-color="#7A5518"/>
    </linearGradient>

    <!-- Tabletop front edge gradient (darker, gives thickness) -->
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5518"/>
      <stop offset="100%" stop-color="#6B4A14"/>
    </linearGradient>

    <!-- Leg gradient -->
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5518"/>
      <stop offset="30%" stop-color="#8B6514"/>
      <stop offset="70%" stop-color="#8B6514"/>
      <stop offset="100%" stop-color="#6B4A14"/>
    </linearGradient>

    <!-- Subtle shadow filter -->
    <filter id="shadow" x="-2%" y="-10%" width="104%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Wood grain pattern -->
    <pattern id="grain" patternUnits="userSpaceOnUse" width="1000" height="24" patternTransform="rotate(0)">
      <line x1="0" y1="5" x2="1000" y2="5.5" stroke="#6B4A14" stroke-width="0.6" opacity="0.25"/>
      <line x1="0" y1="10" x2="1000" y2="9.5" stroke="#6B4A14" stroke-width="0.4" opacity="0.18"/>
      <line x1="0" y1="16" x2="1000" y2="16.8" stroke="#6B4A14" stroke-width="0.7" opacity="0.2"/>
      <line x1="0" y1="21" x2="1000" y2="20.5" stroke="#6B4A14" stroke-width="0.35" opacity="0.15"/>
      <!-- Knot hint -->
      <ellipse cx="320" cy="12" rx="8" ry="4" fill="none" stroke="#6B4A14" stroke-width="0.5" opacity="0.15"/>
      <ellipse cx="710" cy="14" rx="6" ry="3" fill="none" stroke="#6B4A14" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- === Shadow under tabletop === -->
  <rect x="10" y="28" width="980" height="10" rx="2" fill="#000" opacity="0.2" filter="url(#shadow)"/>

  <!-- === Legs === -->
  <!-- Left leg -->
  <path d="M 60,35 L 55,155 L 73,155 L 78,35 Z" fill="url(#legGrad)"/>
  <!-- Left leg highlight -->
  <path d="M 63,35 L 58,155 L 63,155 L 68,35 Z" fill="#A07228" opacity="0.3"/>

  <!-- Right leg -->
  <path d="M 922,35 L 927,155 L 945,155 L 940,35 Z" fill="url(#legGrad)"/>
  <!-- Right leg highlight -->
  <path d="M 932,35 L 937,155 L 932,155 L 927,35 Z" fill="#A07228" opacity="0.3"/>

  <!-- === Tabletop front edge (thickness) === -->
  <rect x="5" y="26" width="990" height="10" rx="1" fill="url(#edgeGrad)"/>

  <!-- === Tabletop surface === -->
  <rect x="5" y="4" width="990" height="24" rx="3" fill="url(#tabletopGrad)"/>

  <!-- Wood grain overlay -->
  <rect x="5" y="4" width="990" height="24" rx="3" fill="url(#grain)"/>

  <!-- Top edge highlight -->
  <line x1="8" y1="5.5" x2="992" y2="5.5" stroke="#D4A84B" stroke-width="0.8" opacity="0.3"/>

  <!-- Subtle rounded end caps for warmth -->
  <rect x="5" y="4" width="990" height="24" rx="3" fill="none" stroke="#5C3D10" stroke-width="0.8" opacity="0.2"/>
</svg>
<p class="label">Side view -- warm brown wooden table with subtle grain, two legs, full width</p>
</div>

</body>
</html>
