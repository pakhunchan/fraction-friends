<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superhero Kids — Character Preview (attempt6)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1729;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e0e8ff;
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff8844 20%, #ffdd44 50%, #44ddff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 0.82rem;
      color: #6080a0;
      margin-bottom: 36px;
      letter-spacing: 0.04em;
    }

    /* Grid: 4 columns (one per hero), 3 rows (moods) + labels */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Top hero name labels */
    .hero-label {
      text-align: center;
      padding-bottom: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Cells */
    .cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 16px;
      border-radius: 16px;
      margin: 6px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.18s ease, background 0.18s ease;
      cursor: default;
    }

    .cell:hover {
      transform: translateY(-4px) scale(1.04);
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.14);
    }

    .mood-tag {
      margin-top: 8px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.55;
    }

    /* Color-coded mood tags */
    .mood-happy  .mood-tag { color: #88ffaa; opacity: 0.85; }
    .mood-neutral .mood-tag { color: #88ccff; opacity: 0.75; }
    .mood-sad    .mood-tag { color: #aaaaff; opacity: 0.75; }

    /* Per-hero accent colors for the name labels */
    .blaze-label  { color: #ff7744; }
    .frost-label  { color: #66ccff; }
    .bolt-label   { color: #ffdd44; }
    .ivy-label    { color: #66ee88; }

    /* Divider rows */
    .mood-row-label {
      grid-column: 1 / -1;
      text-align: left;
      padding: 14px 14px 4px;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #304060;
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.72rem;
      color: #303c50;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

<h1>Superhero Kids</h1>
<p class="subtitle">attempt6 &nbsp;|&nbsp; Character preview &mdash; 4 heroes &times; 3 moods</p>

<div class="grid" id="grid">
  <!-- Hero column labels -->
  <div class="hero-label blaze-label">Blaze</div>
  <div class="hero-label frost-label">Frost</div>
  <div class="hero-label bolt-label">Bolt</div>
  <div class="hero-label ivy-label">Ivy</div>
</div>

<footer>Pure inline SVG &mdash; no external images &mdash; attempt6</footer>

<script>
// ============================================================
// Inline SVG renderer — mirrors Character.tsx logic exactly
// ============================================================

const HEROES = [
  { name: "Blaze",  labelClass: "blaze-label"  },
  { name: "Frost",  labelClass: "frost-label"  },
  { name: "Bolt",   labelClass: "bolt-label"   },
  { name: "Ivy",    labelClass: "ivy-label"    },
];

const MOODS = ["happy", "neutral", "sad"];

// ---- Shared helpers ----
function eyeShine(cx, cy) {
  return `
    <circle cx="${cx}" cy="${cy}" r="1.5" fill="white" opacity="0.95"/>
    <circle cx="${cx + 2.8}" cy="${cy + 2}" r="0.7" fill="white" opacity="0.6"/>
  `;
}

function tear(cx, cy) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="1.4" ry="2.2" fill="#a8d8f0" opacity="0.85"/>`;
}

// ================================================================
// BLAZE (index 0) — red cape, flame mask, warm brown, curly hair
// ================================================================
function blazeCape(mood) {
  if (mood === "happy") return `
    <path d="M 50 78 C 30 74, 4 70, 2 90 L 2 130 L 98 130 L 98 90 C 96 70, 70 74, 50 78 Z"
      fill="url(#blazeCape)" stroke="#8b0000" stroke-width="1.2"/>`;
  if (mood === "sad") return `
    <path d="M 50 78 C 38 80, 18 88, 20 110 L 20 130 L 80 130 L 80 110 C 82 88, 62 80, 50 78 Z"
      fill="url(#blazeCape)" stroke="#8b0000" stroke-width="1.2"/>`;
  return `
    <path d="M 50 78 C 35 76, 10 78, 8 100 L 8 130 L 92 130 L 92 100 C 90 78, 65 76, 50 78 Z"
      fill="url(#blazeCape)" stroke="#8b0000" stroke-width="1.2"/>`;
}

function blazeEyes(mood) {
  if (mood === "happy") return `
    <path d="M 30 40 Q 36 34 42 40" fill="none" stroke="#1a0800" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 58 40 Q 64 34 70 40" fill="none" stroke="#1a0800" stroke-width="2.4" stroke-linecap="round"/>`;
  if (mood === "sad") return `
    <ellipse cx="36" cy="40" rx="5.5" ry="6" fill="white"/>
    <ellipse cx="64" cy="40" rx="5.5" ry="6" fill="white"/>
    <path d="M 30 37 Q 36 35 42 38" fill="none" stroke="#1a0800" stroke-width="1.2"/>
    <path d="M 58 38 Q 64 35 70 37" fill="none" stroke="#1a0800" stroke-width="1.2"/>
    <ellipse cx="36" cy="41.5" rx="3.2" ry="3.6" fill="#3d2010"/>
    <ellipse cx="64" cy="41.5" rx="3.2" ry="3.6" fill="#3d2010"/>
    <circle cx="36" cy="41.5" r="1.8" fill="#0a0500"/>
    <circle cx="64" cy="41.5" r="1.8" fill="#0a0500"/>
    ${eyeShine(34.5, 39.5)} ${eyeShine(62.5, 39.5)}
    ${tear(36, 49)} ${tear(64, 49)}`;
  return `
    <ellipse cx="36" cy="40" rx="5.5" ry="6" fill="white"/>
    <ellipse cx="64" cy="40" rx="5.5" ry="6" fill="white"/>
    <ellipse cx="36" cy="40.5" rx="3.2" ry="3.6" fill="#3d2010"/>
    <ellipse cx="64" cy="40.5" rx="3.2" ry="3.6" fill="#3d2010"/>
    <circle cx="36" cy="40.5" r="1.8" fill="#0a0500"/>
    <circle cx="64" cy="40.5" r="1.8" fill="#0a0500"/>
    ${eyeShine(34.5, 38.8)} ${eyeShine(62.5, 38.8)}`;
}

function blazeBrows(mood) {
  if (mood === "happy") return `
    <path d="M 30 33 Q 36 29 42 32" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>
    <path d="M 58 32 Q 64 29 70 33" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>`;
  if (mood === "sad") return `
    <path d="M 30 32 Q 36 35 42 34" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>
    <path d="M 58 34 Q 64 35 70 32" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>`;
  return `
    <path d="M 30 33 Q 36 31 42 33" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>
    <path d="M 58 33 Q 64 31 70 33" fill="none" stroke="#1a0800" stroke-width="2" stroke-linecap="round"/>`;
}

function blazeMouth(mood) {
  if (mood === "happy") return `
    <path d="M 37 55 Q 50 66 63 55" fill="#c0392b" stroke="#7b1a1a" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 40 56 Q 50 60 60 56" fill="white" stroke="none"/>`;
  if (mood === "sad") return `
    <path d="M 40 60 Q 50 54 60 60" fill="none" stroke="#7b1a1a" stroke-width="2.2" stroke-linecap="round"/>`;
  return `<path d="M 40 56 Q 50 61 60 56" fill="none" stroke="#7b1a1a" stroke-width="2" stroke-linecap="round"/>`;
}

function renderBlaze(mood) {
  const blush = mood === "happy" ? `
    <ellipse cx="26" cy="50" rx="5" ry="3" fill="#e8604a" opacity="0.4"/>
    <ellipse cx="74" cy="50" rx="5" ry="3" fill="#e8604a" opacity="0.4"/>` : "";
  return `
    <defs>
      <radialGradient id="blazeSkin" cx="48%" cy="38%" r="56%">
        <stop offset="0%" stop-color="#c8804a"/>
        <stop offset="100%" stop-color="#9a5a28"/>
      </radialGradient>
      <linearGradient id="blazeCape" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#cc1414"/>
        <stop offset="50%" stop-color="#e83030"/>
        <stop offset="100%" stop-color="#cc1414"/>
      </linearGradient>
      <linearGradient id="blazeBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bb1010"/>
        <stop offset="100%" stop-color="#880808"/>
      </linearGradient>
      <linearGradient id="blazeMask" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#cc2200"/>
        <stop offset="100%" stop-color="#881100"/>
      </linearGradient>
      <linearGradient id="blazeFlame" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ff6600"/>
        <stop offset="60%" stop-color="#ffcc00"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
      </linearGradient>
      <radialGradient id="blazeHair" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#3a2010"/>
        <stop offset="100%" stop-color="#150a04"/>
      </radialGradient>
      <filter id="blazeShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000055"/>
      </filter>
    </defs>

    ${blazeCape(mood)}

    <!-- Body -->
    <path d="M 18 80 Q 18 68 50 66 Q 82 68 82 80 L 82 130 L 18 130 Z"
      fill="url(#blazeBody)" filter="url(#blazeShadow)"/>
    <path d="M 50 72 L 46 82 L 50 80 L 46 92 L 54 79 L 50 81 Z"
      fill="#ff8800" stroke="#ffcc00" stroke-width="0.6"/>
    <path d="M 28 73 Q 50 68 72 73" fill="none" stroke="#ff3300" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Curly hair -->
    <ellipse cx="50" cy="28" rx="28" ry="23" fill="url(#blazeHair)"/>
    <circle cx="30" cy="22" r="7" fill="url(#blazeHair)"/>
    <circle cx="40" cy="14" r="7.5" fill="url(#blazeHair)"/>
    <circle cx="50" cy="11" r="7.5" fill="url(#blazeHair)"/>
    <circle cx="60" cy="14" r="7.5" fill="url(#blazeHair)"/>
    <circle cx="70" cy="22" r="7" fill="url(#blazeHair)"/>
    <circle cx="22" cy="34" r="6" fill="url(#blazeHair)"/>
    <circle cx="78" cy="34" r="6" fill="url(#blazeHair)"/>

    <!-- Face -->
    <ellipse cx="50" cy="44" rx="25" ry="26" fill="url(#blazeSkin)" filter="url(#blazeShadow)"/>
    <ellipse cx="25" cy="44" rx="4.5" ry="5.5" fill="url(#blazeSkin)"/>
    <ellipse cx="75" cy="44" rx="4.5" ry="5.5" fill="url(#blazeSkin)"/>
    <ellipse cx="50" cy="50" rx="2.5" ry="1.8" fill="#8a5020" opacity="0.55"/>

    <!-- Flame mask -->
    <path d="M 22 35 L 32 33 L 28 39 L 38 37 L 34 43 L 22 43 Z" fill="url(#blazeMask)" stroke="#881100" stroke-width="0.5"/>
    <path d="M 78 35 L 68 33 L 72 39 L 62 37 L 66 43 L 78 43 Z" fill="url(#blazeMask)" stroke="#881100" stroke-width="0.5"/>
    <rect x="34" y="33" width="32" height="14" fill="url(#blazeMask)"/>
    <!-- Flame tips -->
    <path d="M 26 33 C 26 25, 31 20, 30 15 C 33 21, 36 18, 35 14 C 38 20, 38 26, 38 30" fill="url(#blazeFlame)"/>
    <path d="M 54 31 C 54 23, 58 18, 57 13 C 60 20, 63 17, 62 12 C 65 19, 65 25, 64 29" fill="url(#blazeFlame)"/>
    <path d="M 67 33 C 68 25, 72 21, 71 16 C 74 22, 76 19, 75 15 C 78 21, 77 27, 74 31" fill="url(#blazeFlame)"/>

    ${blazeBrows(mood)}
    ${blazeEyes(mood)}
    ${blazeMouth(mood)}
    ${blush}
  `;
}

// ================================================================
// FROST (index 1) — blue cape, snowflake tiara, light skin, blonde pigtails
// ================================================================
function frostCape(mood) {
  if (mood === "happy") return `
    <path d="M 50 78 C 28 74, 2 68, 1 90 L 1 130 L 99 130 L 99 90 C 98 68, 72 74, 50 78 Z"
      fill="url(#frostCape)" stroke="#003a8c" stroke-width="1.2"/>`;
  if (mood === "sad") return `
    <path d="M 50 78 C 38 81, 20 90, 22 112 L 22 130 L 78 130 L 78 112 C 80 90, 62 81, 50 78 Z"
      fill="url(#frostCape)" stroke="#003a8c" stroke-width="1.2"/>`;
  return `
    <path d="M 50 78 C 34 76, 10 80, 9 102 L 9 130 L 91 130 L 91 102 C 90 80, 66 76, 50 78 Z"
      fill="url(#frostCape)" stroke="#003a8c" stroke-width="1.2"/>`;
}

function frostEyes(mood) {
  if (mood === "happy") return `
    <path d="M 30 41 Q 37 35 44 41" fill="none" stroke="#1a2a3a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 41 Q 63 35 70 41" fill="none" stroke="#1a2a3a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 30 41 Q 37 45 44 41" fill="none" stroke="#5a8ab0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 56 41 Q 63 45 70 41" fill="none" stroke="#5a8ab0" stroke-width="1.2" stroke-linecap="round"/>`;
  if (mood === "sad") return `
    <ellipse cx="37" cy="41" rx="6" ry="6.5" fill="white"/>
    <ellipse cx="63" cy="41" rx="6" ry="6.5" fill="white"/>
    <path d="M 31 38 Q 37 36 43 39" fill="none" stroke="#1a2a3a" stroke-width="1.2"/>
    <path d="M 57 39 Q 63 36 69 38" fill="none" stroke="#1a2a3a" stroke-width="1.2"/>
    <ellipse cx="37" cy="42.5" rx="3.5" ry="4" fill="#5a9ac8"/>
    <ellipse cx="63" cy="42.5" rx="3.5" ry="4" fill="#5a9ac8"/>
    <circle cx="37" cy="42.5" r="2" fill="#0a1828"/>
    <circle cx="63" cy="42.5" r="2" fill="#0a1828"/>
    ${eyeShine(35, 40.5)} ${eyeShine(61, 40.5)}
    ${tear(37, 50)} ${tear(63, 50)}`;
  return `
    <ellipse cx="37" cy="41" rx="6" ry="6.5" fill="white"/>
    <ellipse cx="63" cy="41" rx="6" ry="6.5" fill="white"/>
    <ellipse cx="37" cy="41.5" rx="3.5" ry="4" fill="#5a9ac8"/>
    <ellipse cx="63" cy="41.5" rx="3.5" ry="4" fill="#5a9ac8"/>
    <circle cx="37" cy="41.5" r="2" fill="#0a1828"/>
    <circle cx="63" cy="41.5" r="2" fill="#0a1828"/>
    ${eyeShine(35, 39.8)} ${eyeShine(61, 39.8)}
    <path d="M 31 38.5 Q 32 36 34.5 37.5" fill="none" stroke="#8ab0cc" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 69 38.5 Q 68 36 65.5 37.5" fill="none" stroke="#8ab0cc" stroke-width="0.9" stroke-linecap="round"/>`;
}

function frostBrows(mood) {
  if (mood === "happy") return `
    <path d="M 31 34 Q 37 30 43 33" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 57 33 Q 63 30 69 34" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>`;
  if (mood === "sad") return `
    <path d="M 31 33 Q 37 36 43 35" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 57 35 Q 63 36 69 33" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>`;
  return `
    <path d="M 31 33 Q 37 31 43 33" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 57 33 Q 63 31 69 33" fill="none" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>`;
}

function frostMouth(mood) {
  if (mood === "happy") return `
    <path d="M 38 56 Q 50 67 62 56" fill="#e87090" stroke="#a04060" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 41 57 Q 50 61 59 57" fill="white" stroke="none"/>`;
  if (mood === "sad") return `
    <path d="M 41 62 Q 50 56 59 62" fill="none" stroke="#a04060" stroke-width="2.2" stroke-linecap="round"/>`;
  return `<path d="M 41 57 Q 50 62 59 57" fill="none" stroke="#a04060" stroke-width="2" stroke-linecap="round"/>`;
}

function renderFrost(mood) {
  const blush = mood === "happy" ? `
    <ellipse cx="26" cy="50" rx="5.5" ry="3.2" fill="#f0a0c0" opacity="0.45"/>
    <ellipse cx="74" cy="50" rx="5.5" ry="3.2" fill="#f0a0c0" opacity="0.45"/>` : "";
  return `
    <defs>
      <radialGradient id="frostSkin" cx="48%" cy="38%" r="56%">
        <stop offset="0%" stop-color="#fdeee0"/>
        <stop offset="100%" stop-color="#f0d0b0"/>
      </radialGradient>
      <linearGradient id="frostCape" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1464cc"/>
        <stop offset="50%" stop-color="#3080e8"/>
        <stop offset="100%" stop-color="#1464cc"/>
      </linearGradient>
      <linearGradient id="frostBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1255bb"/>
        <stop offset="100%" stop-color="#0a3a88"/>
      </linearGradient>
      <linearGradient id="frostTiara" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#a8d8ff"/>
        <stop offset="50%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#a8d8ff"/>
      </linearGradient>
      <radialGradient id="frostGem" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#60c0ff"/>
        <stop offset="100%" stop-color="#0060c0"/>
      </radialGradient>
      <linearGradient id="frostHair" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fce080"/>
        <stop offset="100%" stop-color="#d4a820"/>
      </linearGradient>
      <filter id="frostShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#00004488"/>
      </filter>
      <filter id="frostGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#80d0ff" flood-opacity="0.7"/>
      </filter>
    </defs>

    ${frostCape(mood)}

    <!-- Body -->
    <path d="M 18 80 Q 18 68 50 66 Q 82 68 82 80 L 82 130 L 18 130 Z"
      fill="url(#frostBody)" filter="url(#frostShadow)"/>
    <g filter="url(#frostGlow)">
      <line x1="50" y1="72" x2="50" y2="85" stroke="#a0e0ff" stroke-width="1.2"/>
      <line x1="43.5" y1="74.5" x2="56.5" y2="82.5" stroke="#a0e0ff" stroke-width="1.2"/>
      <line x1="43.5" y1="82.5" x2="56.5" y2="74.5" stroke="#a0e0ff" stroke-width="1.2"/>
      <circle cx="50" cy="78.5" r="2.5" fill="#d0f0ff"/>
    </g>
    <path d="M 28 73 Q 50 68 72 73" fill="none" stroke="#4090dd" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Blonde pigtails -->
    <ellipse cx="19" cy="44" rx="8" ry="20" fill="url(#frostHair)" transform="rotate(-10 19 44)"/>
    <ellipse cx="17" cy="62" rx="5.5" ry="8" fill="url(#frostHair)" transform="rotate(-14 17 62)"/>
    <ellipse cx="81" cy="44" rx="8" ry="20" fill="url(#frostHair)" transform="rotate(10 81 44)"/>
    <ellipse cx="83" cy="62" rx="5.5" ry="8" fill="url(#frostHair)" transform="rotate(14 83 62)"/>
    <!-- Pigtail ties -->
    <ellipse cx="24" cy="31" rx="4" ry="2.5" fill="#60c0ff" stroke="white" stroke-width="0.5"/>
    <ellipse cx="76" cy="31" rx="4" ry="2.5" fill="#60c0ff" stroke="white" stroke-width="0.5"/>

    <!-- Main hair -->
    <ellipse cx="50" cy="30" rx="30" ry="22" fill="url(#frostHair)"/>
    <path d="M 28 30 Q 32 38 36 29 Q 39 22 43 31 Q 47 22 50 31 Q 53 22 57 31 Q 61 22 64 29 Q 68 38 72 30"
      fill="url(#frostHair)"/>

    <!-- Face -->
    <ellipse cx="50" cy="45" rx="25" ry="26" fill="url(#frostSkin)" filter="url(#frostShadow)"/>
    <ellipse cx="25" cy="45" rx="4" ry="5" fill="url(#frostSkin)"/>
    <ellipse cx="75" cy="45" rx="4" ry="5" fill="url(#frostSkin)"/>
    <path d="M 48.5 50 Q 50 52.5 51.5 50" fill="none" stroke="#d4b090" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Tiara -->
    <path d="M 24 28 Q 50 20 76 28" fill="none" stroke="url(#frostTiara)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="23" r="5" fill="url(#frostGem)" stroke="white" stroke-width="0.8"/>
    <line x1="50" y1="18" x2="50" y2="28" stroke="white" stroke-width="0.8"/>
    <line x1="45" y1="20.7" x2="55" y2="25.3" stroke="white" stroke-width="0.8"/>
    <line x1="45" y1="25.3" x2="55" y2="20.7" stroke="white" stroke-width="0.8"/>
    <circle cx="36" cy="26.5" r="2.5" fill="url(#frostGem)" stroke="white" stroke-width="0.6"/>
    <circle cx="64" cy="26.5" r="2.5" fill="url(#frostGem)" stroke="white" stroke-width="0.6"/>

    ${frostBrows(mood)}
    ${frostEyes(mood)}
    ${frostMouth(mood)}
    ${blush}
  `;
}

// ================================================================

// ================================================================
// Renderers array
// ================================================================
const renderers = [renderBlaze, renderFrost, renderBolt, renderIvy];

// ================================================================
// Build the grid
// ================================================================
const grid = document.getElementById("grid");
const SIZE = 130; // px per character

MOODS.forEach(mood => {
  // Row label
  const rowLabel = document.createElement("div");
  rowLabel.className = "mood-row-label";
  rowLabel.textContent = mood.charAt(0).toUpperCase() + mood.slice(1);
  grid.appendChild(rowLabel);

  // 4 character cells
  HEROES.forEach((hero, idx) => {
    const cell = document.createElement("div");
    cell.className = `cell mood-${mood}`;

    const svgInner = renderers[idx](mood);
    cell.innerHTML = `
      <svg width="${SIZE}" height="${Math.round(SIZE * 1.3)}" viewBox="0 0 100 130"
           xmlns="http://www.w3.org/2000/svg">
        ${svgInner}
      </svg>
      <div class="mood-tag">${mood}</div>
    `;
    grid.appendChild(cell);
  });
});
</script>
