<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodland Animal Characters — Attempt 3 Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1729;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e8eaf6;
      min-height: 100vh;
      padding: 32px 24px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #a8d4a0, #f0c870, #f09050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      color: #8892b0;
      font-size: 0.88rem;
      margin-bottom: 36px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 880px;
      margin: 0 auto;
    }

    .col-header {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8892b0;
      padding-bottom: 8px;
    }

    .character-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 18px 12px 14px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .character-cell:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.18);
    }

    .animal-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6a7590;
    }
    .mood-badge {
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .mood-neutral { background: rgba(100,120,200,0.2); color: #8899dd; }
    .mood-happy   { background: rgba(100,200,100,0.2); color: #80cc80; }
    .mood-sad     { background: rgba(100,140,220,0.2); color: #7aa0e0; }

    .mood-row-label {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6a7590;
      align-self: center;
    }

    .section-divider {
      max-width: 880px;
      margin: 36px auto 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #8892b0;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .section-divider::before, .section-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .size-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      max-width: 880px;
      margin: 0 auto;
      padding: 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .size-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .size-label {
      font-size: 0.65rem;
      color: #6a7590;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<h1>Woodland Animal Characters</h1>
<p class="subtitle">Attempt 3 &mdash; Fraction Tutor App &mdash; 4 animals &times; 3 moods</p>

<div class="grid" id="grid-headers">
  <div class="col-header">Bear</div>
  <div class="col-header">Bunny</div>
  <div class="col-header">Fox</div>
  <div class="col-header">Owl</div>
</div>

<div class="grid" id="character-grid"></div>

<div class="section-divider">Scale test — Bear (neutral)</div>
<div class="size-row" id="size-row"></div>

<script>
// ============================================================
//  SVG HELPERS
// ============================================================
const SVG_NS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs = {}, children = []) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== undefined && v !== null) el.setAttribute(k, v);
  }
  for (const child of children) {
    if (child) el.appendChild(child);
  }
  return el;
}

function circle(cx, cy, r, fill, attrs = {}) {
  return svgEl("circle", { cx, cy, r, fill, ...attrs });
}
function ellipse(cx, cy, rx, ry, fill, attrs = {}) {
  return svgEl("ellipse", { cx, cy, rx, ry, fill, ...attrs });
}
function path(d, attrs = {}) {
  return svgEl("path", { d, ...attrs });
}
function line(x1, y1, x2, y2, attrs = {}) {
  return svgEl("line", { x1, y1, x2, y2, ...attrs });
}
function g(attrs = {}, children = []) {
  const el = svgEl("g", attrs);
  for (const c of children) if (c) el.appendChild(c);
  return el;
}
function defs(children = []) {
  const el = svgEl("defs");
  for (const c of children) if (c) el.appendChild(c);
  return el;
}

// gradients
function radialGradient(id, cx, cy, r, stops) {
  const grad = svgEl("radialGradient", { id, cx, cy, r });
  for (const [offset, color] of stops) {
    grad.appendChild(svgEl("stop", { offset, "stop-color": color }));
  }
  return grad;
}
function linearGradient(id, x1, y1, x2, y2, stops) {
  const grad = svgEl("linearGradient", { id, x1, y1, x2, y2 });
  for (const [offset, color] of stops) {
    grad.appendChild(svgEl("stop", { offset, "stop-color": color }));
  }
  return grad;
}
function filter(id, children = []) {
  const el = svgEl("filter", { id, x: "-15%", y: "-15%", width: "130%", height: "140%" });
  for (const c of children) el.appendChild(c);
  return el;
}
function dropShadow(dx, dy, stdDeviation, floodColor, floodOpacity) {
  return svgEl("feDropShadow", { dx, dy, stdDeviation, "flood-color": floodColor, "flood-opacity": floodOpacity });
}
function pattern(id, pw, ph, children = []) {
  const el = svgEl("pattern", { id, x: 0, y: 0, width: pw, height: ph, patternUnits: "userSpaceOnUse" });
  for (const c of children) el.appendChild(c);
  return el;
}

// Eye helpers
function eyeGlint(cx, cy) {
  return circle(cx, cy, 1.6, "white", { opacity: 0.95 });
}
function eyeGlint2(cx, cy) {
  return circle(cx + 2.5, cy + 1.8, 0.75, "white", { opacity: 0.55 });
}

// ============================================================
//  BEAR (Character 0)
// ============================================================
function renderBear(mood, uid) {
  const bId = (s) => `${s}_${uid}`;

  // Eyebrows
  const browAttrs = { fill: "none", stroke: "#3d2006", "stroke-width": 2, "stroke-linecap": "round" };
  let brows;
  if (mood === "neutral") {
    brows = g({}, [
      path("M 31 34 Q 37 30 43 34", browAttrs),
      path("M 57 34 Q 63 30 69 34", browAttrs),
    ]);
  } else if (mood === "happy") {
    brows = g({}, [
      path("M 31 31 Q 37 26 43 31", browAttrs),
      path("M 57 31 Q 63 26 69 31", browAttrs),
    ]);
  } else {
    brows = g({}, [
      path("M 32 33 Q 37 36 43 34", browAttrs),
      path("M 57 34 Q 63 36 68 33", browAttrs),
    ]);
  }

  // Eyes
  let eyes;
  if (mood === "neutral") {
    eyes = g({}, [
      ellipse(38, 41, 5.5, 6, "white"),
      ellipse(62, 41, 5.5, 6, "white"),
      ellipse(38, 41.5, 3.4, 3.8, "#3d1f00"),
      ellipse(62, 41.5, 3.4, 3.8, "#3d1f00"),
      circle(38, 41.5, 1.8, "#0e0600"),
      circle(62, 41.5, 1.8, "#0e0600"),
      eyeGlint(36.4, 39.6), eyeGlint(60.4, 39.6),
      eyeGlint2(36.4, 39.6), eyeGlint2(60.4, 39.6),
    ]);
  } else if (mood === "happy") {
    eyes = g({}, [
      path("M 33 42 Q 38 35 43 42", { fill: "white" }),
      path("M 33 42 Q 38 46 43 42", { fill: "white" }),
      path("M 57 42 Q 62 35 67 42", { fill: "white" }),
      path("M 57 42 Q 62 46 67 42", { fill: "white" }),
      ellipse(38, 41, 3, 2.6, "#3d1f00"),
      ellipse(62, 41, 3, 2.6, "#3d1f00"),
      eyeGlint(36.5, 39.8), eyeGlint(60.5, 39.8),
    ]);
  } else {
    eyes = g({}, [
      ellipse(38, 42, 5.5, 5.5, "white"),
      ellipse(62, 42, 5.5, 5.5, "white"),
      path("M 33 40 Q 38 38 43 41", { fill: "none", stroke: "#7a5030", "stroke-width": 1.4 }),
      path("M 57 41 Q 62 38 67 40", { fill: "none", stroke: "#7a5030", "stroke-width": 1.4 }),
      ellipse(38, 43, 3.4, 3.6, "#3d1f00"),
      ellipse(62, 43, 3.4, 3.6, "#3d1f00"),
      circle(38, 43, 1.8, "#0e0600"),
      circle(62, 43, 1.8, "#0e0600"),
      eyeGlint(36.4, 41.4), eyeGlint(60.4, 41.4),
      ellipse(32, 50, 1.2, 1.8, "#a8d4f0", { opacity: 0.8 }),
      ellipse(68, 50, 1.2, 1.8, "#a8d4f0", { opacity: 0.8 }),
    ]);
  }

  // Mouth
  let mouth;
  if (mood === "neutral") {
    mouth = path("M 41 53 Q 50 59 59 53", { fill: "none", stroke: "#3d1f00", "stroke-width": 2.2, "stroke-linecap": "round" });
  } else if (mood === "happy") {
    mouth = g({}, [
      path("M 38 51 Q 50 63 62 51", { fill: "#c0392b", stroke: "#3d1f00", "stroke-width": 2, "stroke-linecap": "round" }),
      path("M 42 52 Q 50 56 58 52", { fill: "white" }),
      ellipse(50, 57, 4, 2.5, "#e57070"),
    ]);
  } else {
    mouth = path("M 41 58 Q 50 52 59 58", { fill: "none", stroke: "#3d1f00", "stroke-width": 2.2, "stroke-linecap": "round" });
  }

  const blush = mood === "happy" ? g({}, [
    ellipse(27, 49, 5, 3, "#d97850", { opacity: 0.38 }),
    ellipse(73, 49, 5, 3, "#d97850", { opacity: 0.38 }),
  ]) : null;

  const earLY = mood === "sad" ? 14 : mood === "happy" ? 10 : 12;

  return g({}, [
    defs([
      radialGradient(bId("bearFur"), "45%", "38%", "60%", [["0%", "#c87941"], ["100%", "#8b4e1a"]]),
      radialGradient(bId("bearBelly"), "50%", "50%", "55%", [["0%", "#e8c49a"], ["100%", "#d4a870"]]),
      radialGradient(bId("bearEar"), "50%", "35%", "60%", [["0%", "#c87941"], ["100%", "#7a3e10"]]),
      filter(bId("bearShadow"), [dropShadow(0, 2, 2, "#5a2e00", 0.3)]),
    ]),
    // Body
    ellipse(50, 88, 28, 18, `url(#${bId("bearFur")})`),
    ellipse(50, 84, 15, 12, `url(#${bId("bearBelly")})`),
    // Ears
    circle(25, earLY + 10, 10, `url(#${bId("bearEar")})`),
    circle(25, earLY + 10, 5.5, "#d4936b"),
    circle(75, earLY + 10, 10, `url(#${bId("bearEar")})`),
    circle(75, earLY + 10, 5.5, "#d4936b"),
    // Head
    circle(50, 46, 30, `url(#${bId("bearFur")})`, { filter: `url(#${bId("bearShadow")})` }),
    // Muzzle
    ellipse(50, 55, 12, 9, `url(#${bId("bearBelly")})`),
    // Nose
    ellipse(50, 50, 5, 3.5, "#2a1200"),
    ellipse(48.5, 49, 1.4, 0.9, "white", { opacity: 0.35 }),
    brows, eyes, mouth, blush,
  ]);
}

// ============================================================
//  BUNNY (Character 1)
// ============================================================
function renderBunny(mood, uid) {
  const bId = (s) => `${s}_${uid}`;

  const earTiltL = mood === "happy" ? -8 : mood === "sad" ? 18 : 0;
  const earTiltR = mood === "happy" ? 8 : mood === "sad" ? -18 : 0;

  const browAttrs = { fill: "none", stroke: "#c060a0", "stroke-width": 1.5, "stroke-linecap": "round" };
  let brows;
  if (mood === "neutral") {
    brows = g({}, [
      path("M 32 37 Q 38 33 44 37", browAttrs),
      path("M 56 37 Q 62 33 68 37", browAttrs),
    ]);
  } else if (mood === "happy") {
    brows = g({}, [
      path("M 32 34 Q 38 29 44 34", browAttrs),
      path("M 56 34 Q 62 29 68 34", browAttrs),
    ]);
  } else {
    brows = g({}, [
      path("M 33 36 Q 38 39 44 37", browAttrs),
      path("M 56 37 Q 62 39 67 36", browAttrs),
    ]);
  }

  let eyes;
  if (mood === "neutral") {
    eyes = g({}, [
      ellipse(37, 42, 6, 6.5, "white"),
      ellipse(63, 42, 6, 6.5, "white"),
      ellipse(37, 42.5, 3.8, 4.2, "#e060c0"),
      ellipse(63, 42.5, 3.8, 4.2, "#e060c0"),
      circle(37, 42.5, 2, "#1a0e14"),
      circle(63, 42.5, 2, "#1a0e14"),
      eyeGlint(35, 40.5), eyeGlint(61, 40.5),
      eyeGlint2(35, 40.5), eyeGlint2(61, 40.5),
    ]);
  } else if (mood === "happy") {
    eyes = g({}, [
      path("M 31 43 Q 37 36 43 43", { fill: "white" }),
      path("M 31 43 Q 37 47 43 43", { fill: "white" }),
      path("M 57 43 Q 63 36 69 43", { fill: "white" }),
      path("M 57 43 Q 63 47 69 43", { fill: "white" }),
      ellipse(37, 42, 3.5, 2.8, "#e060c0"),
      ellipse(63, 42, 3.5, 2.8, "#e060c0"),
      circle(37, 41.8, 1.7, "#1a0e14"),
      circle(63, 41.8, 1.7, "#1a0e14"),
      eyeGlint(35.2, 40.5), eyeGlint(61.2, 40.5),
    ]);
  } else {
    eyes = g({}, [
      ellipse(37, 43, 6, 6, "white"),
      ellipse(63, 43, 6, 6, "white"),
      path("M 31 41 Q 37 39 43 42", { fill: "none", stroke: "#c060a0", "stroke-width": 1.2 }),
      path("M 57 42 Q 63 39 69 41", { fill: "none", stroke: "#c060a0", "stroke-width": 1.2 }),
      ellipse(37, 44, 3.8, 4, "#e060c0"),
      ellipse(63, 44, 3.8, 4, "#e060c0"),
      circle(37, 44, 2, "#1a0e14"),
      circle(63, 44, 2, "#1a0e14"),
      eyeGlint(35, 42), eyeGlint(61, 42),
      path("M 31 50 Q 30 54 32 56 Q 34 58 33 54 Z", { fill: "#a8d4f5", opacity: 0.85 }),
      path("M 69 50 Q 70 54 68 56 Q 66 58 67 54 Z", { fill: "#a8d4f5", opacity: 0.85 }),
    ]);
  }

  let mouth;
  if (mood === "neutral") {
    mouth = g({}, [
      path("M 50 54 L 50 57", { fill: "none", stroke: "#e080b0", "stroke-width": 1.6, "stroke-linecap": "round" }),
      path("M 43 57 Q 50 62 57 57", { fill: "none", stroke: "#e080b0", "stroke-width": 2, "stroke-linecap": "round" }),
    ]);
  } else if (mood === "happy") {
    mouth = g({}, [
      path("M 50 52 L 50 55", { fill: "none", stroke: "#e080b0", "stroke-width": 1.6, "stroke-linecap": "round" }),
      path("M 40 54 Q 50 65 60 54", { fill: "#e87070", stroke: "#c06060", "stroke-width": 1.8, "stroke-linecap": "round" }),
      path("M 44 55 Q 50 59 56 55", { fill: "white" }),
    ]);
  } else {
    mouth = g({}, [
      path("M 50 58 L 50 61", { fill: "none", stroke: "#e080b0", "stroke-width": 1.6, "stroke-linecap": "round" }),
      path("M 43 62 Q 50 56 57 62", { fill: "none", stroke: "#e080b0", "stroke-width": 2, "stroke-linecap": "round" }),
    ]);
  }

  const blush = mood === "happy"
    ? g({}, [
        ellipse(25, 50, 6, 3.5, "#ffb0d8", { opacity: 0.5 }),
        ellipse(75, 50, 6, 3.5, "#ffb0d8", { opacity: 0.5 }),
      ])
    : g({}, [
        ellipse(25, 50, 5, 3, "#ffb0d8", { opacity: 0.25 }),
        ellipse(75, 50, 5, 3, "#ffb0d8", { opacity: 0.25 }),
      ]);

  // Ears as groups with transforms
  function makeEar(cx, tilt) {
    const earG = g({ transform: `rotate(${tilt}, ${cx}, 48)` }, [
      ellipse(cx, 18, 8, 22, `url(#${bId("bunnyFur")})`),
      ellipse(cx, 18, 4.5, 16, `url(#${bId("bunnyEarInner")})`),
    ]);
    return earG;
  }

  return g({}, [
    defs([
      radialGradient(bId("bunnyFur"), "40%", "35%", "60%", [["0%", "#ffffff"], ["100%", "#e8dde8"]]),
      radialGradient(bId("bunnyPink"), "50%", "40%", "55%", [["0%", "#ffcce8"], ["100%", "#f0a0cc"]]),
      radialGradient(bId("bunnyEarInner"), "50%", "30%", "70%", [["0%", "#ffb0d8"], ["100%", "#e890c0"]]),
      filter(bId("bunnyShadow"), [dropShadow(0, 2, 2.5, "#b070a0", 0.25)]),
    ]),
    // Body
    ellipse(50, 90, 26, 16, `url(#${bId("bunnyFur")})`),
    ellipse(50, 87, 13, 10, `url(#${bId("bunnyPink")})`, { opacity: 0.5 }),
    // Ears before head
    makeEar(35, earTiltL),
    makeEar(65, earTiltR),
    // Head
    circle(50, 50, 28, `url(#${bId("bunnyFur")})`, { filter: `url(#${bId("bunnyShadow")})` }),
    // Cheek pouches
    circle(22, 53, 8, `url(#${bId("bunnyFur")})`, { opacity: 0.8 }),
    circle(78, 53, 8, `url(#${bId("bunnyFur")})`, { opacity: 0.8 }),
    // Muzzle
    ellipse(50, 57, 9, 6, `url(#${bId("bunnyPink")})`, { opacity: 0.6 }),
    // Nose
    ellipse(50, 53, 3.5, 2.4, "#e870b0"),
    ellipse(49, 52.2, 1, 0.7, "white", { opacity: 0.45 }),
    // Whiskers
    line(32, 55, 46, 54, { stroke: "#d0b0c8", "stroke-width": 0.8, opacity: 0.6, "stroke-linecap": "round" }),
    line(32, 58, 46, 57, { stroke: "#d0b0c8", "stroke-width": 0.8, opacity: 0.6, "stroke-linecap": "round" }),
    line(54, 54, 68, 55, { stroke: "#d0b0c8", "stroke-width": 0.8, opacity: 0.6, "stroke-linecap": "round" }),
    line(54, 57, 68, 58, { stroke: "#d0b0c8", "stroke-width": 0.8, opacity: 0.6, "stroke-linecap": "round" }),
    brows, eyes, mouth, blush,
  ]);
}

// ============================================================
//  FOX (Character 2)
// ============================================================
function renderFox(mood, uid) {
  const bId = (s) => `${s}_${uid}`;

  const browAttrs = { fill: "none", stroke: "#5a2800", "stroke-width": 1.8, "stroke-linecap": "round" };
  let brows;
  if (mood === "neutral") {
    brows = g({}, [
      path("M 31 34 Q 37 30 44 33", browAttrs),
      path("M 56 33 Q 63 30 69 34", browAttrs),
    ]);
  } else if (mood === "happy") {
    brows = g({}, [
      path("M 31 31 Q 37 26 44 30", browAttrs),
      path("M 56 30 Q 63 26 69 31", browAttrs),
    ]);
  } else {
    brows = g({}, [
      path("M 32 33 Q 37 36 44 34", browAttrs),
      path("M 56 34 Q 63 36 68 33", browAttrs),
    ]);
  }

  let eyes;
  if (mood === "neutral") {
    eyes = g({}, [
      ellipse(37, 41, 5.5, 6, "white"),
      ellipse(63, 41, 5.5, 6, "white"),
      ellipse(37, 41.5, 3.5, 3.8, "#c87820"),
      ellipse(63, 41.5, 3.5, 3.8, "#c87820"),
      ellipse(37, 41.5, 1.2, 3.2, "#1e0e00"),
      ellipse(63, 41.5, 1.2, 3.2, "#1e0e00"),
      eyeGlint(35.4, 39.6), eyeGlint(61.4, 39.6),
      eyeGlint2(35.4, 39.6), eyeGlint2(61.4, 39.6),
    ]);
  } else if (mood === "happy") {
    eyes = g({}, [
      path("M 32 42 Q 37 35 43 42", { fill: "white" }),
      path("M 32 42 Q 37 46 43 42", { fill: "white" }),
      path("M 57 42 Q 62 35 68 42", { fill: "white" }),
      path("M 57 42 Q 62 46 68 42", { fill: "white" }),
      ellipse(37, 41, 3, 2.6, "#c87820"),
      ellipse(63, 41, 3, 2.6, "#c87820"),
      eyeGlint(35.4, 39.8), eyeGlint(61.4, 39.8),
    ]);
  } else {
    eyes = g({}, [
      ellipse(37, 42, 5.5, 5.5, "white"),
      ellipse(63, 42, 5.5, 5.5, "white"),
      path("M 32 40 Q 37 38 43 41", { fill: "none", stroke: "#8a4010", "stroke-width": 1.3 }),
      path("M 57 41 Q 63 38 68 40", { fill: "none", stroke: "#8a4010", "stroke-width": 1.3 }),
      ellipse(37, 43, 3.5, 3.6, "#c87820"),
      ellipse(63, 43, 3.5, 3.6, "#c87820"),
      ellipse(37, 43, 1.2, 3, "#1e0e00"),
      ellipse(63, 43, 1.2, 3, "#1e0e00"),
      eyeGlint(35.4, 41.4), eyeGlint(61.4, 41.4),
      ellipse(31, 50, 1.4, 2, "#a8d4f0", { opacity: 0.8 }),
      ellipse(69, 50, 1.4, 2, "#a8d4f0", { opacity: 0.8 }),
    ]);
  }

  let mouth;
  if (mood === "neutral") {
    mouth = path("M 42 54 Q 50 59 58 54", { fill: "none", stroke: "#5a2800", "stroke-width": 2, "stroke-linecap": "round" });
  } else if (mood === "happy") {
    mouth = g({}, [
      path("M 39 52 Q 50 64 61 52", { fill: "#c04030", stroke: "#5a2800", "stroke-width": 2, "stroke-linecap": "round" }),
      path("M 43 53 Q 50 57 57 53", { fill: "white" }),
      ellipse(50, 58, 4.5, 3, "#e06060"),
    ]);
  } else {
    mouth = path("M 42 58 Q 50 52 58 58", { fill: "none", stroke: "#5a2800", "stroke-width": 2, "stroke-linecap": "round" });
  }

  const blush = mood === "happy" ? g({}, [
    ellipse(26, 50, 6, 3.5, "#f09060", { opacity: 0.4 }),
    ellipse(74, 50, 6, 3.5, "#f09060", { opacity: 0.4 }),
  ]) : null;

  const tail = mood !== "sad" ? g({}, [
    svgEl("ellipse", { cx: 76, cy: 93, rx: 14, ry: 9, fill: `url(#${bId("foxOrange")})`, transform: "rotate(-20 76 93)" }),
    svgEl("ellipse", { cx: 76, cy: 93, rx: 7, ry: 4.5, fill: `url(#${bId("foxWhite")})`, transform: "rotate(-20 76 93)" }),
  ]) : null;

  return g({}, [
    defs([
      radialGradient(bId("foxOrange"), "40%", "35%", "62%", [["0%", "#f08030"], ["100%", "#c05010"]]),
      radialGradient(bId("foxWhite"), "50%", "40%", "55%", [["0%", "#fff8f0"], ["100%", "#f0e4d0"]]),
      radialGradient(bId("foxEar"), "50%", "20%", "70%", [["0%", "#f08030"], ["100%", "#a03010"]]),
      filter(bId("foxShadow"), [dropShadow(0, 2, 2, "#8a3000", 0.3)]),
    ]),
    tail,
    // Body
    ellipse(50, 89, 27, 17, `url(#${bId("foxOrange")})`),
    ellipse(50, 86, 14, 10, `url(#${bId("foxWhite")})`),
    // Pointy ears
    path("M 20 30 L 30 5 L 40 30 Z", { fill: `url(#${bId("foxEar")})` }),
    path("M 23 28 L 30 10 L 37 28 Z", { fill: "#e05020", opacity: 0.5 }),
    path("M 60 30 L 70 5 L 80 30 Z", { fill: `url(#${bId("foxEar")})` }),
    path("M 63 28 L 70 10 L 77 28 Z", { fill: "#e05020", opacity: 0.5 }),
    // Head
    ellipse(50, 46, 29, 27, `url(#${bId("foxOrange")})`, { filter: `url(#${bId("foxShadow")})` }),
    // White cheek patches
    ellipse(32, 52, 10, 8, `url(#${bId("foxWhite")})`),
    ellipse(68, 52, 10, 8, `url(#${bId("foxWhite")})`),
    // Muzzle
    ellipse(50, 56, 11, 8, `url(#${bId("foxWhite")})`),
    // Nose
    ellipse(50, 51, 4, 2.8, "#1a0a00"),
    ellipse(48.8, 50.2, 1.2, 0.8, "white", { opacity: 0.4 }),
    // Whiskers
    line(28, 55, 44, 53, { stroke: "#8a5030", "stroke-width": 0.9, opacity: 0.5, "stroke-linecap": "round" }),
    line(28, 58, 44, 57, { stroke: "#8a5030", "stroke-width": 0.9, opacity: 0.5, "stroke-linecap": "round" }),
    line(56, 53, 72, 55, { stroke: "#8a5030", "stroke-width": 0.9, opacity: 0.5, "stroke-linecap": "round" }),
    line(56, 57, 72, 58, { stroke: "#8a5030", "stroke-width": 0.9, opacity: 0.5, "stroke-linecap": "round" }),
    brows, eyes, mouth, blush,
  ]);
}

// ============================================================
//  OWL (Character 3)
// ============================================================
function renderOwl(mood, uid) {
  const bId = (s) => `${s}_${uid}`;

  const browBaseAttrs = { fill: "none", stroke: "#4a3820", "stroke-width": 2.2, "stroke-linecap": "round" };
  const browDetailAttrs = { fill: "none", stroke: "#4a3820", "stroke-width": 1, "stroke-linecap": "round", opacity: 0.6 };

  let brows;
  if (mood === "neutral") {
    brows = g({}, [
      path("M 27 31 Q 33 26 39 30", browBaseAttrs),
      path("M 61 30 Q 67 26 73 31", browBaseAttrs),
      path("M 28 30 Q 31 27 34 29", browDetailAttrs),
      path("M 66 29 Q 69 27 72 30", browDetailAttrs),
    ]);
  } else if (mood === "happy") {
    brows = g({}, [
      path("M 27 28 Q 33 22 39 27", browBaseAttrs),
      path("M 61 27 Q 67 22 73 28", browBaseAttrs),
      path("M 28 27 Q 31 23 34 26", browDetailAttrs),
      path("M 66 26 Q 69 23 72 27", browDetailAttrs),
    ]);
  } else {
    brows = g({}, [
      path("M 28 29 Q 33 33 39 31", browBaseAttrs),
      path("M 61 31 Q 67 33 72 29", browBaseAttrs),
      path("M 29 28 Q 32 32 35 30", browDetailAttrs),
      path("M 65 30 Q 68 32 71 28", browDetailAttrs),
    ]);
  }

  // Owl eyes — enormous
  let eyes;
  const outerRing = (cx) => [
    circle(cx, 43, 12, "#7a6040"),
    circle(cx, 43, 10, "#c8a870"),
    circle(cx, 43, 8, "white"),
  ];

  if (mood === "neutral") {
    eyes = g({}, [
      ...outerRing(35), ...outerRing(65),
      circle(35, 43, 5.5, "#e8a020"),
      circle(65, 43, 5.5, "#e8a020"),
      circle(35, 43, 3, "#0a0600"),
      circle(65, 43, 3, "#0a0600"),
      eyeGlint(32.5, 40.5), eyeGlint(62.5, 40.5),
      eyeGlint2(32.5, 40.5), eyeGlint2(62.5, 40.5),
      circle(37, 45, 0.9, "white", { opacity: 0.4 }),
      circle(67, 45, 0.9, "white", { opacity: 0.4 }),
    ]);
  } else if (mood === "happy") {
    eyes = g({}, [
      ...outerRing(35), ...outerRing(65),
      // eyelid mask clips top half
      path("M 27 43 Q 35 33 43 43", { fill: "#c8a870" }),
      path("M 57 43 Q 65 33 73 43", { fill: "#c8a870" }),
      circle(35, 45, 5.5, "#e8a020"),
      circle(65, 45, 5.5, "#e8a020"),
      circle(35, 45, 3, "#0a0600"),
      circle(65, 45, 3, "#0a0600"),
      eyeGlint(32.5, 43), eyeGlint(62.5, 43),
    ]);
  } else {
    eyes = g({}, [
      ...outerRing(35), ...outerRing(65),
      path("M 27 43 Q 35 37 43 43", { fill: "#c8a870" }),
      path("M 57 43 Q 65 37 73 43", { fill: "#c8a870" }),
      circle(35, 44, 5.5, "#e8a020"),
      circle(65, 44, 5.5, "#e8a020"),
      circle(35, 44, 3, "#0a0600"),
      circle(65, 44, 3, "#0a0600"),
      eyeGlint(32.5, 42), eyeGlint(62.5, 42),
      path("M 29 51 Q 28 56 30 60 Q 31 56 30 52 Z", { fill: "#a8d4f5", opacity: 0.9 }),
      path("M 71 51 Q 72 56 70 60 Q 69 56 70 52 Z", { fill: "#a8d4f5", opacity: 0.9 }),
    ]);
  }

  const beak = path("M 45 55 L 50 62 L 55 55 Q 52 58 50 58 Q 48 58 45 55 Z",
    { fill: "#e8a030", stroke: "#c07818", "stroke-width": 0.8, "stroke-linejoin": "round" });

  let mouthBelow;
  if (mood === "happy") {
    mouthBelow = path("M 43 62 Q 50 67 57 62", { fill: "none", stroke: "#c07818", "stroke-width": 1.8, "stroke-linecap": "round" });
  } else if (mood === "sad") {
    mouthBelow = path("M 43 66 Q 50 61 57 66", { fill: "none", stroke: "#c07818", "stroke-width": 1.8, "stroke-linecap": "round" });
  } else {
    mouthBelow = null;
  }

  const blush = mood === "happy" ? g({}, [
    ellipse(22, 52, 5, 3, "#e8b070", { opacity: 0.4 }),
    ellipse(78, 52, 5, 3, "#e8b070", { opacity: 0.4 }),
  ]) : null;

  return g({}, [
    defs([
      radialGradient(bId("owlBody"), "40%", "35%", "62%", [["0%", "#a08060"], ["100%", "#604828"]]),
      radialGradient(bId("owlDisc"), "50%", "40%", "55%", [["0%", "#d4b888"], ["100%", "#b89060"]]),
      radialGradient(bId("owlBelly"), "50%", "40%", "55%", [["0%", "#e8d8b0"], ["100%", "#c8b080"]]),
      filter(bId("owlShadow"), [dropShadow(0, 2, 2.5, "#402010", 0.3)]),
      (() => {
        const pat = svgEl("pattern", { id: bId("featherPat"), x: 0, y: 0, width: 6, height: 4, patternUnits: "userSpaceOnUse" });
        pat.appendChild(path("M 0 2 Q 3 0 6 2 Q 3 4 0 2 Z", { fill: "#7a5a38", opacity: 0.25 }));
        return pat;
      })(),
    ]),
    // Wings
    ellipse(50, 88, 30, 16, `url(#${bId("owlBody")})`),
    ellipse(50, 88, 30, 16, `url(#${bId("featherPat")})`),
    // Belly
    ellipse(50, 85, 16, 11, `url(#${bId("owlBelly")})`),
    path("M 40 78 Q 50 82 60 78", { fill: "none", stroke: "#b09060", "stroke-width": 0.8, opacity: 0.5 }),
    path("M 38 83 Q 50 88 62 83", { fill: "none", stroke: "#b09060", "stroke-width": 0.8, opacity: 0.5 }),
    // Ear tufts
    path("M 27 22 L 22 6 L 34 20 Z", { fill: `url(#${bId("owlBody")})` }),
    path("M 23 20 L 20 8 L 30 18 Z", { fill: "#8a6840", opacity: 0.6 }),
    path("M 73 22 L 78 6 L 66 20 Z", { fill: `url(#${bId("owlBody")})` }),
    path("M 77 20 L 80 8 L 70 18 Z", { fill: "#8a6840", opacity: 0.6 }),
    // Head
    circle(50, 44, 32, `url(#${bId("owlBody")})`, { filter: `url(#${bId("owlShadow")})` }),
    // Facial disc
    ellipse(50, 47, 25, 23, `url(#${bId("owlDisc")})`),
    brows, eyes, beak, mouthBelow, blush,
  ]);
}

// ============================================================
//  BUILD SVG FROM RENDERER
// ============================================================
const RENDERERS = [renderBear, renderBunny, renderFox, renderOwl];
const ANIMAL_NAMES = ["Bear", "Bunny", "Fox", "Owl"];
const MOODS = ["neutral", "happy", "sad"];
const MOOD_LABELS = ["Neutral", "Happy", "Sad"];

let uidCounter = 0;

function createCharacterSVG(animalIndex, mood, size = 140) {
  uidCounter++;
  const uid = `c${animalIndex}_${mood}_${uidCounter}`;
  const svg = svgEl("svg", {
    width: size,
    height: size,
    viewBox: "0 0 100 100",
    xmlns: SVG_NS,
  });
  const rendered = RENDERERS[animalIndex](mood, uid);
  svg.appendChild(rendered);
  return svg;
}

// ============================================================
//  RENDER GRID  (moods as rows, animals as columns)
// ============================================================
const grid = document.getElementById("character-grid");

MOODS.forEach((mood, mi) => {
  RENDERERS.forEach((_, ai) => {
    const cell = document.createElement("div");
    cell.className = "character-cell";

    const svg = createCharacterSVG(ai, mood, 140);

    const animalLabel = document.createElement("span");
    animalLabel.className = "animal-label";
    animalLabel.textContent = ANIMAL_NAMES[ai];

    const moodBadge = document.createElement("span");
    moodBadge.className = `mood-badge mood-${mood}`;
    moodBadge.textContent = MOOD_LABELS[mi];

    cell.appendChild(svg);
    cell.appendChild(animalLabel);
    cell.appendChild(moodBadge);

    grid.appendChild(cell);
  });
});

// ============================================================
//  SCALE ROW — Bear neutral at different sizes
// ============================================================
const sizeRow = document.getElementById("size-row");
const SIZES = [32, 48, 64, 80, 100, 120, 160, 200];

SIZES.forEach(sz => {
  const item = document.createElement("div");
  item.className = "size-item";

  const svg = createCharacterSVG(0, "neutral", sz);

  const label = document.createElement("span");
  label.className = "size-label";
  label.textContent = `${sz}px`;

  item.appendChild(svg);
  item.appendChild(label);
  sizeRow.appendChild(item);
});
</script>
